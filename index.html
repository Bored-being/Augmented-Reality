<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <img id="random-image" scr="trees-in-landscape-scaled-1.png">
      </a-assets>
      <a-marker preset='hiro'>
        <a-box position="-1 0.5 1" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-cylinder position="1 0.75 1" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
        <a-plane position="0 0 1" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
        <a-image src="trees-in-landscape-scaled-1.png" position="0 3 3" width="4" height="5" rotation="-90 0 0"></a-image>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
